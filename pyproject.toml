[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "school-lens"
version = "0.1.0"
description = "Address-anchored local school data engine and transparent comparison tool"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "geopandas>=1.0.0",
    "pyarrow>=17.0.0",
    "pyproj>=3.6.0",
    "shapely>=2.0.0",
    "pandas>=2.2.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]
# The two generic GIS utilities reused from the (private) house-hunter project
# are vendored in school_lens/_vendor/ (arcgis.py, normalize.py) so this repo
# stands alone. house-hunter's parcel DB remains an optional local enrichment
# (address autocomplete); without it the app still serves everything else.

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
scrape = [
    "beautifulsoup4>=4.12.0",
    "curl_cffi>=0.7.0",
]

[project.scripts]
school-lens = "school_lens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
